name: Build legacy DB packages - FreeBSD 14

on:
  workflow_dispatch:
  push:
    branches:
      - db-matrix-freebsd11-14
    paths:
      - '.github/workflows/build-legacy-db-f14.yml'
      - 'tools/import_package_closure.py'

permissions:
  contents: write

concurrency:
  group: legacy-db-f14-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout repository metadata
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.gitattributes
            /README.md
            /tools/
            /.github/workflows/
            /FreeBSD:14:amd64/latest/packagesite.txz
            /FreeBSD:14:amd64/latest/SHA256SUMS

      - name: Build MySQL 5.5, MySQL 5.6 and MariaDB 10.3 in FreeBSD 14.3
        uses: cross-platform-actions/action@24ef01df165c76df1ed2b9f9e9212e78dc2fc963
        with:
          operating_system: freebsd
          architecture: x86-64
          version: '14.3'
          shell: sh
          run: |
            set -eux

            REPO_ROOT="$PWD"
            OUT="$REPO_ROOT/.legacy-build/14"
            sudo rm -rf "$OUT" /tmp/ports-mysql55 /tmp/ports-mysql56 /tmp/ports-mariadb103 /tmp/ports-*.tar.gz
            sudo mkdir -p "$OUT"
            sudo chown -R "$(id -u):$(id -g)" "$OUT"

            sudo env ASSUME_ALWAYS_YES=yes pkg update -f
            sudo env ASSUME_ALWAYS_YES=yes pkg install -y \
              ca_root_nss bash cmake-core bison libevent liblz4 libedit readline \
              groff perl5 gmake pkgconf pcre2 boost-libs rsync

            fetch_ports() {
              commit="$1"
              dest="$2"
              archive="/tmp/ports-${commit}.tar.gz"
              sudo fetch --no-verify-peer -o "$archive" \
                "https://codeload.github.com/freebsd/freebsd-ports/tar.gz/${commit}"
              sudo mkdir -p "$dest"
              sudo tar -xzf "$archive" -C "$dest" --strip-components=1
            }

            snapshot_closure() {
              family="$1"
              dest="$OUT/$family/all"
              sudo mkdir -p "$dest"
              sudo pkg create -a -o "$dest"
              sudo chown -R "$(id -u):$(id -g)" "$OUT/$family"
              echo "Closure for $family:"
              ls -1 "$dest" | wc -l
            }

            build_pair() {
              ports="$1"
              family="$2"
              extra_opts="${3:-}"
              client="$ports/databases/${family}-client"
              server="$ports/databases/${family}-server"
              test -d "$client"
              test -d "$server"

              sudo env BATCH=yes DISABLE_VULNERABILITIES=yes ALLOW_UNSUPPORTED_SYSTEM=yes \
                OPTIONS_UNSET="$extra_opts" make -C "$client" clean package install
              sudo env BATCH=yes DISABLE_VULNERABILITIES=yes ALLOW_UNSUPPORTED_SYSTEM=yes \
                OPTIONS_UNSET="$extra_opts" make -C "$server" clean package install

              pkg info -e "${family}-client" || exit 20
              pkg info -e "${family}-server" || exit 21
              snapshot_closure "$family"
              sudo env ASSUME_ALWAYS_YES=yes pkg delete -fy "${family}-server" "${family}-client" || true
            }

            # MySQL 5.5 final FreeBSD port. SSL is deliberately disabled: 5.5
            # predates OpenSSL 3 and the Metin2 database workload does not need
            # TLS inside the local game/database host path.
            fetch_ports 9f0ff92f6deaa2187cdb33a27f5aebbdd2c0d71d /tmp/ports-mysql55
            build_pair /tmp/ports-mysql55 mysql55 "SSL"

            # This is the final MySQL 5.6 tree after FreeBSD's OpenSSL 3 base
            # compatibility fix (PR 271656), before the port was removed.
            fetch_ports f8301140055f9b0fac6e3c23458e48c7cff2ef05 /tmp/ports-mysql56
            build_pair /tmp/ports-mysql56 mysql56 "ARCHIVE BLACKHOLE EXAMPLE FEDERATED PARTITION"

            # Last MariaDB 10.3 release in ports.
            fetch_ports 06b18c35a7ac6d3bfda4a40cab1b3ff638b2ac0c /tmp/ports-mariadb103
            build_pair /tmp/ports-mariadb103 mariadb103 \
              "WSREP CONNECT_EXTRA MROONGA OQGRAPH ROCKSDB SPHINX SPIDER"

            find "$OUT" -type f \( -name '*.pkg' -o -name '*.txz' \) -maxdepth 4 -print

      - name: Install package archive reader
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libarchive-tools xz-utils

      - name: Import required runtime package closures
        run: |
          set -eux
          for family in mysql55 mysql56 mariadb103; do
            python3 tools/import_package_closure.py \
              --repo 'FreeBSD:14:amd64/latest' \
              --source-dir ".legacy-build/14/${family}/all" \
              --root "${family}-client" --root "${family}-server" \
              --provenance-out ".legacy-build/${family}-f14.json"
          done

          python3 - <<'PY'
          import json
          from pathlib import Path
          rows = []
          for path in sorted(Path('.legacy-build').glob('*-f14.json')):
              rows.extend(json.loads(path.read_text()))
          Path('DB_SOURCE_BUILD_PACKAGES_F14.json').write_text(
              json.dumps({
                  'builder': 'FreeBSD 14.3 native VM',
                  'mysql55_ports_commit': '9f0ff92f6deaa2187cdb33a27f5aebbdd2c0d71d',
                  'mysql56_ports_commit': 'f8301140055f9b0fac6e3c23458e48c7cff2ef05',
                  'mariadb103_ports_commit': '06b18c35a7ac6d3bfda4a40cab1b3ff638b2ac0c',
                  'packages': rows,
              }, indent=2) + '\n'
          )
          PY

      - name: Validate FreeBSD 14 repository roots
        run: |
          python3 - <<'PY'
          import json, tarfile
          from pathlib import Path
          p = Path('FreeBSD:14:amd64/latest/packagesite.txz')
          with tarfile.open(p, 'r:xz') as tf:
              m = next(x for x in tf.getmembers() if x.name.endswith('packagesite.yaml'))
              rows = [json.loads(x) for x in tf.extractfile(m).read().decode().splitlines() if x.strip()]
          names = {x['name'] for x in rows}
          required = {
              'mariadb103-client','mariadb103-server',
              'mariadb105-client','mariadb105-server',
              'mariadb106-client','mariadb106-server',
              'mariadb114-client','mariadb114-server',
              'mysql55-client','mysql55-server',
              'mysql56-client','mysql56-server',
          }
          missing = sorted(required - names)
          assert not missing, f'Missing FreeBSD 14 DB packages: {missing}'
          assert len(names) == len(rows), 'duplicate package names'
          print('FreeBSD 14 legacy DB catalogue OK:', len(rows), 'packages')
          PY

      - name: Commit native FreeBSD 14 packages
        run: |
          git config user.name "PvPSunucusu repo bot"
          git config user.email "actions@users.noreply.github.com"

          git add --sparse DB_SOURCE_BUILD_PACKAGES_F14.json \
            'FreeBSD:14:amd64/latest/packagesite.txz' \
            'FreeBSD:14:amd64/latest/SHA256SUMS'
          find 'FreeBSD:14:amd64/latest/All' -type f -print0 | xargs -0 -r git add --sparse --

          if git diff --cached --quiet; then
            echo 'No source-built package changes required.'
            exit 0
          fi

          git commit -m 'Add native legacy DB packages for FreeBSD 14 [skip ci]'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:${GITHUB_REF_NAME}

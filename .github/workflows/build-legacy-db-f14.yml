name: Build MySQL legacy packages - FreeBSD 14

on:
  workflow_dispatch:
  push:
    branches:
      - db-matrix-freebsd11-14
    paths:
      - '.github/workflows/build-legacy-db-f14.yml'
      - 'tools/build_legacy_db_native.sh'
      - 'tools/import_package_closure.py'

permissions:
  contents: write

concurrency:
  group: legacy-mysql-f14-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository metadata
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.gitattributes
            /README.md
            /tools/
            /.github/workflows/
            /FreeBSD:14:amd64/latest/packagesite.txz
            /FreeBSD:14:amd64/latest/SHA256SUMS

      - name: Build MySQL 5.5 and 5.6 natively on FreeBSD 14.3
        uses: cross-platform-actions/action@24ef01df165c76df1ed2b9f9e9212e78dc2fc963
        with:
          operating_system: freebsd
          architecture: x86-64
          version: '14.3'
          shell: sh
          run: |
            set -eux
            sudo env REPO_ROOT="$PWD" FAMILIES='mysql55 mysql56' sh tools/build_legacy_db_native.sh 14

      - name: Install package archive reader
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libarchive-tools xz-utils

      - name: Import MySQL runtime closures
        run: |
          set -eux
          for family in mysql55 mysql56; do
            python3 tools/import_package_closure.py \
              --repo 'FreeBSD:14:amd64/latest' \
              --source-dir ".legacy-build/14/${family}/all" \
              --root "${family}-client" --root "${family}-server" \
              --provenance-out ".legacy-build/${family}-f14.json"
          done
          python3 - <<'PY'
          import json
          from pathlib import Path
          rows=[]
          for p in sorted(Path('.legacy-build').glob('mysql*-f14.json')):
              rows.extend(json.loads(p.read_text()))
          Path('DB_MYSQL_F14_SOURCE.json').write_text(json.dumps({
              'builder':'FreeBSD 14.3 native VM',
              'packages':rows,
          },indent=2)+'\n')
          PY

      - name: Validate FreeBSD 14 MySQL roots
        run: |
          python3 - <<'PY'
          import json,tarfile
          p='FreeBSD:14:amd64/latest/packagesite.txz'
          with tarfile.open(p,'r:xz') as tf:
              m=next(x for x in tf.getmembers() if x.name.endswith('packagesite.yaml'))
              rows=[json.loads(x) for x in tf.extractfile(m).read().decode().splitlines() if x.strip()]
          by={x['name']:x for x in rows}
          for name in ('mysql55-client','mysql55-server','mysql56-client','mysql56-server'):
              assert name in by, name
              blob=(str(by[name].get('arch',''))+' '+str(by[name].get('abi',''))).lower()
              assert 'freebsd:14:' in blob, (name,blob)
          assert len(by)==len(rows), 'duplicate package names'
          print('FreeBSD 14 MySQL catalogue OK')
          PY

      - name: Commit native FreeBSD 14 MySQL packages
        run: |
          set -eux
          git config user.name 'PvPSunucusu repo bot'
          git config user.email 'actions@users.noreply.github.com'
          git add --sparse DB_MYSQL_F14_SOURCE.json \
            'FreeBSD:14:amd64/latest/packagesite.txz' \
            'FreeBSD:14:amd64/latest/SHA256SUMS'
          find 'FreeBSD:14:amd64/latest/All' -type f -print0 | xargs -0 -r git add --sparse --
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add native MySQL 5.5 and 5.6 packages for FreeBSD 14 [skip ci]'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:${GITHUB_REF_NAME}

name: Build legacy DB packages - FreeBSD 12

on:
  workflow_dispatch:
  push:
    branches:
      - db-matrix-freebsd11-14
    paths:
      - '.github/workflows/build-legacy-db-f12.yml'
      - 'tools/import_package_closure.py'

permissions:
  contents: write

concurrency:
  group: legacy-db-f12-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository metadata
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.gitattributes
            /README.md
            /tools/
            /.github/workflows/
            /FreeBSD:12:amd64/latest/packagesite.txz
            /FreeBSD:12:amd64/latest/SHA256SUMS

      - name: Build missing DB families in FreeBSD 12.4
        uses: cross-platform-actions/action@24ef01df165c76df1ed2b9f9e9212e78dc2fc963
        with:
          operating_system: freebsd
          architecture: x86-64
          version: '12.4'
          shell: sh
          run: |
            set -eux

            REPO_ROOT="$PWD"
            OUT="$REPO_ROOT/.legacy-build/12"
            sudo rm -rf "$OUT" /tmp/ports-mysql55 /tmp/ports-mariadb103 /tmp/ports-mariadb106 /tmp/ports-mariadb114 /tmp/ports-*.tar.gz
            sudo mkdir -p "$OUT"
            sudo chown -R "$(id -u):$(id -g)" "$OUT"

            # FreeBSD 12 is EOL. Use two independent archives for bootstrap
            # packages; the ports themselves still build missing dependencies.
            sudo mkdir -p /usr/local/etc/pkg/repos
            sudo sh -c 'cat > /usr/local/etc/pkg/repos/FreeBSD.conf' <<'EOF'
            FreeBSD: { enabled: no }
            Nepustil: {
              url: "https://repo.nepustil.net/FreeBSD:12:amd64",
              mirror_type: "none",
              signature_type: "none",
              priority: 20,
              enabled: yes
            }
            SGGS: {
              url: "https://mirror.sg.gs/freebsd-pkg/FreeBSD:12:amd64/latest",
              mirror_type: "none",
              signature_type: "none",
              priority: 10,
              enabled: yes
            }
            EOF
            sudo env ASSUME_ALWAYS_YES=yes pkg update -f || true

            # Bootstrap opportunistically. Do not fail here if an EOL archive no
            # longer has one package: make(1) will build the dependency from the
            # matching historical ports tree.
            for p in ca_root_nss bash cmake cmake-core bison libevent liblz4 libedit readline groff gmake pkgconf pcre2 boost-libs rsync perl5 perl5.32; do
              sudo env ASSUME_ALWAYS_YES=yes pkg install -y "$p" || true
            done

            fetch_ports() {
              commit="$1"
              dest="$2"
              archive="/tmp/ports-${commit}.tar.gz"
              sudo fetch --no-verify-peer -o "$archive" \
                "https://codeload.github.com/freebsd/freebsd-ports/tar.gz/${commit}"
              sudo mkdir -p "$dest"
              sudo tar -xzf "$archive" -C "$dest" --strip-components=1
            }

            snapshot_closure() {
              family="$1"
              dest="$OUT/$family/all"
              sudo mkdir -p "$dest"
              sudo pkg create -a -o "$dest"
              sudo chown -R "$(id -u):$(id -g)" "$OUT/$family"
              echo "Closure for $family:"
              ls -1 "$dest" | wc -l
            }

            build_pair() {
              ports="$1"
              family="$2"
              extra_opts="${3:-}"
              client="$ports/databases/${family}-client"
              server="$ports/databases/${family}-server"
              test -d "$client"
              test -d "$server"

              sudo env BATCH=yes DISABLE_VULNERABILITIES=yes ALLOW_UNSUPPORTED_SYSTEM=yes \
                OPTIONS_UNSET="$extra_opts" make -C "$client" clean package install
              sudo env BATCH=yes DISABLE_VULNERABILITIES=yes ALLOW_UNSUPPORTED_SYSTEM=yes \
                OPTIONS_UNSET="$extra_opts" make -C "$server" clean package install

              pkg info -e "${family}-client" || exit 20
              pkg info -e "${family}-server" || exit 21
              snapshot_closure "$family"
              sudo env ASSUME_ALWAYS_YES=yes pkg delete -fy "${family}-server" "${family}-client" || true
            }

            # MySQL 5.5 final port.
            fetch_ports 9f0ff92f6deaa2187cdb33a27f5aebbdd2c0d71d /tmp/ports-mysql55
            build_pair /tmp/ports-mysql55 mysql55 "SSL"

            # MariaDB 10.3 final port.
            fetch_ports 06b18c35a7ac6d3bfda4a40cab1b3ff638b2ac0c /tmp/ports-mariadb103
            build_pair /tmp/ports-mariadb103 mariadb103 \
              "WSREP CONNECT_EXTRA MROONGA OQGRAPH ROCKSDB SPHINX SPIDER"

            # MariaDB 10.6 from a period when the port was actively supported
            # on the FreeBSD 12 generation.
            fetch_ports 0cc2151714f7a11a1367a5b2d4bc2cd18bc26dbd /tmp/ports-mariadb106
            build_pair /tmp/ports-mariadb106 mariadb106 \
              "WSREP CONNECT_EXTRA MROONGA OQGRAPH ROCKSDB SPHINX SPIDER"

            # First FreeBSD MariaDB 11.4 LTS port. It has the smallest modern
            # dependency surface and is built natively against the FreeBSD 12 ABI.
            fetch_ports 5a2bb7e61569f908f8a52dd4afd2998b86e9e54d /tmp/ports-mariadb114
            build_pair /tmp/ports-mariadb114 mariadb114 \
              "WSREP CONNECT_EXTRA MROONGA OQGRAPH ROCKSDB S3 SPHINX SPIDER"

            find "$OUT" -type f \( -name '*.pkg' -o -name '*.txz' \) -maxdepth 4 -print

      - name: Install package archive reader
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libarchive-tools xz-utils

      - name: Import required runtime package closures
        run: |
          set -eux
          for family in mysql55 mariadb103 mariadb106 mariadb114; do
            python3 tools/import_package_closure.py \
              --repo 'FreeBSD:12:amd64/latest' \
              --source-dir ".legacy-build/12/${family}/all" \
              --root "${family}-client" --root "${family}-server" \
              --provenance-out ".legacy-build/${family}-f12.json"
          done

          python3 - <<'PY'
          import json
          from pathlib import Path
          rows = []
          for path in sorted(Path('.legacy-build').glob('*-f12.json')):
              rows.extend(json.loads(path.read_text()))
          Path('DB_SOURCE_BUILD_PACKAGES_F12.json').write_text(
              json.dumps({
                  'builder': 'FreeBSD 12.4 native VM',
                  'mysql55_ports_commit': '9f0ff92f6deaa2187cdb33a27f5aebbdd2c0d71d',
                  'mariadb103_ports_commit': '06b18c35a7ac6d3bfda4a40cab1b3ff638b2ac0c',
                  'mariadb106_ports_commit': '0cc2151714f7a11a1367a5b2d4bc2cd18bc26dbd',
                  'mariadb114_ports_commit': '5a2bb7e61569f908f8a52dd4afd2998b86e9e54d',
                  'packages': rows,
              }, indent=2) + '\n'
          )
          PY

      - name: Validate FreeBSD 12 repository roots
        run: |
          python3 - <<'PY'
          import json, tarfile
          from pathlib import Path
          p = Path('FreeBSD:12:amd64/latest/packagesite.txz')
          with tarfile.open(p, 'r:xz') as tf:
              m = next(x for x in tf.getmembers() if x.name.endswith('packagesite.yaml'))
              rows = [json.loads(x) for x in tf.extractfile(m).read().decode().splitlines() if x.strip()]
          names = {x['name'] for x in rows}
          required = {
              'mariadb103-client','mariadb103-server',
              'mariadb105-client','mariadb105-server',
              'mariadb106-client','mariadb106-server',
              'mariadb114-client','mariadb114-server',
              'mysql55-client','mysql55-server',
              'mysql56-client','mysql56-server',
          }
          missing = sorted(required - names)
          assert not missing, f'Missing FreeBSD 12 DB packages: {missing}'
          assert len(names) == len(rows), 'duplicate package names'
          print('FreeBSD 12 legacy DB catalogue OK:', len(rows), 'packages')
          PY

      - name: Commit native FreeBSD 12 packages
        run: |
          git config user.name "PvPSunucusu repo bot"
          git config user.email "actions@users.noreply.github.com"

          git add --sparse DB_SOURCE_BUILD_PACKAGES_F12.json \
            'FreeBSD:12:amd64/latest/packagesite.txz' \
            'FreeBSD:12:amd64/latest/SHA256SUMS'
          find 'FreeBSD:12:amd64/latest/All' -type f -print0 | xargs -0 -r git add --sparse --

          if git diff --cached --quiet; then
            echo 'No source-built package changes required.'
            exit 0
          fi

          git commit -m 'Add native legacy DB packages for FreeBSD 12 [skip ci]'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:${GITHUB_REF_NAME}

name: Complete MySQL 5.5 - FreeBSD 12

on:
  workflow_dispatch:
  push:
    branches:
      - mysql55-56-all-freebsd
    paths:
      - '.github/workflows/build-legacy-db-f12.yml'
      - 'tools/build_legacy_db_native.sh'
      - 'tools/import_package_closure.py'

permissions:
  contents: write

concurrency:
  group: mysql-f12-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository metadata
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.gitattributes
            /README.md
            /tools/
            /.github/workflows/
            /FreeBSD:12:amd64/latest/packagesite.txz
            /FreeBSD:12:amd64/latest/SHA256SUMS

      - name: Build MySQL 5.5 natively on FreeBSD 12.4
        uses: cross-platform-actions/action@24ef01df165c76df1ed2b9f9e9212e78dc2fc963
        with:
          operating_system: freebsd
          architecture: x86-64
          version: '12.4'
          shell: sh
          run: |
            set -eux
            sudo env REPO_ROOT="$PWD" sh tools/build_legacy_db_native.sh 12

      - name: Install package archive reader
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libarchive-tools xz-utils

      - name: Import MySQL 5.5 runtime closure
        run: |
          set -eux
          python3 tools/import_package_closure.py \
            --repo 'FreeBSD:12:amd64/latest' \
            --source-dir '.legacy-build/12/mysql55/all' \
            --root mysql55-client --root mysql55-server \
            --provenance-out '.legacy-build/mysql55-f12.json'
          cp '.legacy-build/mysql55-f12.json' DB_SOURCE_BUILD_PACKAGES_F12.json

      - name: Validate FreeBSD 12 MySQL roots
        run: |
          python3 - <<'PY'
          import json,tarfile
          from pathlib import Path
          p=Path('FreeBSD:12:amd64/latest/packagesite.txz')
          with tarfile.open(p,'r:xz') as tf:
              m=next(x for x in tf.getmembers() if x.name.endswith('packagesite.yaml'))
              rows=[json.loads(x) for x in tf.extractfile(m).read().decode().splitlines() if x.strip()]
          names={x['name'] for x in rows}
          required={'mysql55-client','mysql55-server','mysql56-client','mysql56-server'}
          missing=sorted(required-names)
          assert not missing, f'Missing FreeBSD 12 MySQL packages: {missing}'
          print('FreeBSD 12 MySQL 5.5/5.6 OK')
          PY

      - name: Commit FreeBSD 12 MySQL 5.5 packages
        run: |
          git config user.name "PvPSunucusu repo bot"
          git config user.email "actions@users.noreply.github.com"
          git add --sparse DB_SOURCE_BUILD_PACKAGES_F12.json \
            'FreeBSD:12:amd64/latest/packagesite.txz' \
            'FreeBSD:12:amd64/latest/SHA256SUMS'
          find 'FreeBSD:12:amd64/latest/All' -type f -print0 | xargs -0 -r git add --sparse --
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add MySQL 5.5 for FreeBSD 12 [skip ci]'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:${GITHUB_REF_NAME}

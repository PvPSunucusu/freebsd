name: Build legacy DB packages - FreeBSD 13

on:
  workflow_dispatch:
  push:
    branches:
      - db-matrix-freebsd11-14
    paths:
      - '.github/workflows/build-legacy-db-f13.yml'
      - 'tools/import_package_closure.py'

permissions:
  contents: write

concurrency:
  group: legacy-db-f13-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout repository metadata
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.gitattributes
            /README.md
            /DB_PACKAGE_MATRIX.md
            /DB_PACKAGE_SOURCES.json
            /tools/
            /.github/workflows/
            /FreeBSD:13:amd64/latest/packagesite.txz
            /FreeBSD:13:amd64/latest/SHA256SUMS

      - name: Build MySQL 5.5, MySQL 5.6 and MariaDB 10.3 in FreeBSD 13.5
        uses: cross-platform-actions/action@24ef01df165c76df1ed2b9f9e9212e78dc2fc963
        with:
          operating_system: freebsd
          architecture: x86-64
          version: '13.5'
          shell: sh
          run: |
            set -eux

            REPO_ROOT="$PWD"
            OUT="$REPO_ROOT/.legacy-build/13"
            sudo rm -rf "$OUT" /tmp/ports-mysql /tmp/ports-mariadb /tmp/ports-*.tar.gz
            sudo mkdir -p "$OUT"
            sudo chown -R "$(id -u):$(id -g)" "$OUT"

            sudo mkdir -p /usr/local/etc/pkg/repos
            sudo sh -c 'cat > /usr/local/etc/pkg/repos/FreeBSD.conf' <<'EOF'
            FreeBSD: { enabled: no }
            PvPArchive: {
              url: "https://repo.nepustil.net/FreeBSD:13:amd64",
              mirror_type: "none",
              signature_type: "none",
              enabled: yes
            }
            EOF

            sudo env ASSUME_ALWAYS_YES=yes pkg update -f
            sudo env ASSUME_ALWAYS_YES=yes pkg install -y \
              ca_root_nss bash cmake bison libevent liblz4 libedit readline \
              groff perl5 gmake pkgconf pcre2 boost-libs rsync

            fetch_ports() {
              commit="$1"
              dest="$2"
              archive="/tmp/ports-${commit}.tar.gz"
              sudo fetch --no-verify-peer -o "$archive" \
                "https://codeload.github.com/freebsd/freebsd-ports/tar.gz/${commit}"
              sudo mkdir -p "$dest"
              sudo tar -xzf "$archive" -C "$dest" --strip-components=1
            }

            snapshot_closure() {
              family="$1"
              dest="$OUT/$family/all"
              sudo mkdir -p "$dest"
              sudo pkg create -a -o "$dest"
              sudo chown -R "$(id -u):$(id -g)" "$OUT/$family"
              echo "Closure for $family:"
              ls -1 "$dest" | wc -l
            }

            build_pair() {
              ports="$1"
              family="$2"
              extra_opts="${3:-}"
              client="$ports/databases/${family}-client"
              server="$ports/databases/${family}-server"

              test -d "$client"
              test -d "$server"

              sudo env BATCH=yes DISABLE_VULNERABILITIES=yes ALLOW_UNSUPPORTED_SYSTEM=yes \
                OPTIONS_UNSET="$extra_opts" make -C "$client" clean package install
              sudo env BATCH=yes DISABLE_VULNERABILITIES=yes ALLOW_UNSUPPORTED_SYSTEM=yes \
                OPTIONS_UNSET="$extra_opts" make -C "$server" clean package install

              pkg info -e "${family}-client" || exit 20
              pkg info -e "${family}-server" || exit 21
              snapshot_closure "$family"

              sudo env ASSUME_ALWAYS_YES=yes pkg delete -fy "${family}-server" "${family}-client" || true
            }

            # 2022-05-16: both mysql55 and mysql56 are present at their final
            # FreeBSD ports versions (5.5.62_3 and 5.6.51).
            fetch_ports 9f0ff92f6deaa2187cdb33a27f5aebbdd2c0d71d /tmp/ports-mysql
            build_pair /tmp/ports-mysql mysql55 "SSL"
            build_pair /tmp/ports-mysql mysql56 "ARCHIVE BLACKHOLE EXAMPLE FEDERATED PARTITION"

            # 2023-02-19: MariaDB 10.3.38. Cluster/search engines are not needed
            # for the Metin2 database workload, keeping the fallback small.
            fetch_ports 06b18c35a7ac6d3bfda4a40cab1b3ff638b2ac0c /tmp/ports-mariadb
            build_pair /tmp/ports-mariadb mariadb103 \
              "WSREP CONNECT_EXTRA MROONGA OQGRAPH ROCKSDB SPHINX SPIDER"

            find "$OUT" -type f \( -name '*.pkg' -o -name '*.txz' \) -maxdepth 4 -print

      - name: Install package archive reader
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libarchive-tools xz-utils

      - name: Import only required runtime package closures
        run: |
          set -eux
          python3 tools/import_package_closure.py \
            --repo 'FreeBSD:13:amd64/latest' \
            --source-dir '.legacy-build/13/mysql55/all' \
            --root mysql55-client --root mysql55-server \
            --provenance-out '.legacy-build/mysql55-f13.json'

          python3 tools/import_package_closure.py \
            --repo 'FreeBSD:13:amd64/latest' \
            --source-dir '.legacy-build/13/mysql56/all' \
            --root mysql56-client --root mysql56-server \
            --provenance-out '.legacy-build/mysql56-f13.json'

          python3 tools/import_package_closure.py \
            --repo 'FreeBSD:13:amd64/latest' \
            --source-dir '.legacy-build/13/mariadb103/all' \
            --root mariadb103-client --root mariadb103-server \
            --provenance-out '.legacy-build/mariadb103-f13.json'

          python3 - <<'PY'
          import json
          from pathlib import Path
          rows = []
          for path in sorted(Path('.legacy-build').glob('*-f13.json')):
              rows.extend(json.loads(path.read_text()))
          Path('DB_SOURCE_BUILD_PACKAGES.json').write_text(
              json.dumps({
                  'builder': 'FreeBSD 13.5 native VM',
                  'mysql_ports_commit': '9f0ff92f6deaa2187cdb33a27f5aebbdd2c0d71d',
                  'mariadb103_ports_commit': '06b18c35a7ac6d3bfda4a40cab1b3ff638b2ac0c',
                  'packages': rows,
              }, indent=2) + '\n'
          )
          PY

          python3 tools/sync_db_packages.py \
            --report DB_PACKAGE_MATRIX.md \
            --provenance /tmp/nonimport-provenance.json

      - name: Validate FreeBSD 13 repository catalogue and DB roots
        run: |
          python3 - <<'PY'
          import json, tarfile
          from pathlib import Path
          p = Path('FreeBSD:13:amd64/latest/packagesite.txz')
          with tarfile.open(p, 'r:xz') as tf:
              m = next(x for x in tf.getmembers() if x.name.endswith('packagesite.yaml'))
              rows = [json.loads(x) for x in tf.extractfile(m).read().decode().splitlines() if x.strip()]
          names = {x['name'] for x in rows}
          required = {
              'mariadb105-client','mariadb105-server',
              'mariadb106-client','mariadb106-server',
              'mariadb103-client','mariadb103-server',
              'mysql55-client','mysql55-server',
              'mysql56-client','mysql56-server',
          }
          missing = sorted(required - names)
          assert not missing, f'Missing FreeBSD 13 DB packages: {missing}'
          assert len(names) == len(rows), 'duplicate package names'
          print('FreeBSD 13 legacy DB catalogue OK:', len(rows), 'packages')
          PY

      - name: Commit native FreeBSD 13 packages
        run: |
          git config user.name "PvPSunucusu repo bot"
          git config user.email "actions@users.noreply.github.com"

          git add --sparse DB_PACKAGE_MATRIX.md DB_SOURCE_BUILD_PACKAGES.json \
            'FreeBSD:13:amd64/latest/packagesite.txz' \
            'FreeBSD:13:amd64/latest/SHA256SUMS'
          find 'FreeBSD:13:amd64/latest/All' -type f -print0 | xargs -0 -r git add --sparse --

          if git diff --cached --quiet; then
            echo 'No source-built package changes required.'
            exit 0
          fi

          git commit -m 'Add native legacy DB packages for FreeBSD 13 [skip ci]'
          git push origin HEAD:${GITHUB_REF_NAME}

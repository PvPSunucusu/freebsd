name: Build MySQL legacy packages - FreeBSD 13

on:
  workflow_dispatch:
  push:
    branches:
      - db-matrix-freebsd11-14
    paths:
      - '.github/workflows/build-legacy-db-f13.yml'
      - 'tools/build_legacy_db_native.sh'
      - 'tools/import_package_closure.py'

permissions:
  contents: write

concurrency:
  group: legacy-mysql-f13-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository metadata
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.gitattributes
            /README.md
            /tools/
            /.github/workflows/
            /FreeBSD:13:amd64/latest/packagesite.txz
            /FreeBSD:13:amd64/latest/SHA256SUMS

      - name: Build MySQL 5.5 natively on FreeBSD 13.5
        uses: cross-platform-actions/action@24ef01df165c76df1ed2b9f9e9212e78dc2fc963
        with:
          operating_system: freebsd
          architecture: x86-64
          version: '13.5'
          shell: sh
          run: |
            set -eux
            sudo env REPO_ROOT="$PWD" FAMILIES='mysql55' sh tools/build_legacy_db_native.sh 13

      - name: Install package archive reader
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libarchive-tools xz-utils

      - name: Import MySQL 5.5 runtime closure
        run: |
          set -eux
          python3 tools/import_package_closure.py \
            --repo 'FreeBSD:13:amd64/latest' \
            --source-dir '.legacy-build/13/mysql55/all' \
            --root mysql55-client --root mysql55-server \
            --provenance-out 'DB_MYSQL55_F13_SOURCE.json'

      - name: Validate FreeBSD 13 MySQL roots
        run: |
          python3 - <<'PY'
          import json,tarfile
          p='FreeBSD:13:amd64/latest/packagesite.txz'
          with tarfile.open(p,'r:xz') as tf:
              m=next(x for x in tf.getmembers() if x.name.endswith('packagesite.yaml'))
              rows=[json.loads(x) for x in tf.extractfile(m).read().decode().splitlines() if x.strip()]
          by={x['name']:x for x in rows}
          for name in ('mysql55-client','mysql55-server','mysql56-client','mysql56-server'):
              assert name in by, name
              blob=(str(by[name].get('arch',''))+' '+str(by[name].get('abi',''))).lower()
              assert 'freebsd:13:' in blob, (name,blob)
          assert len(by)==len(rows), 'duplicate package names'
          print('FreeBSD 13 MySQL catalogue OK')
          PY

      - name: Commit native FreeBSD 13 MySQL 5.5 packages
        run: |
          set -eux
          git config user.name 'PvPSunucusu repo bot'
          git config user.email 'actions@users.noreply.github.com'
          git add --sparse DB_MYSQL55_F13_SOURCE.json \
            'FreeBSD:13:amd64/latest/packagesite.txz' \
            'FreeBSD:13:amd64/latest/SHA256SUMS'
          find 'FreeBSD:13:amd64/latest/All' -type f -print0 | xargs -0 -r git add --sparse --
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add native MySQL 5.5 packages for FreeBSD 13 [skip ci]'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:${GITHUB_REF_NAME}

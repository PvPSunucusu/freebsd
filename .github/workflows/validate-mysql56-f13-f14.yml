name: Validate MySQL 5.6 on FreeBSD 13 and 14

on:
  workflow_dispatch:
  push:
    branches:
      - mysql55-56-freebsd12-14
    paths:
      - '.github/workflows/validate-mysql56-f13-f14.yml'

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - freebsd: '13.4'
            major: '13'
          - freebsd: '14.3'
            major: '14'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download HelpDev x64 bundle
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p .mysql56-helpdev
          base='http://kamil2321.ovh/mysql/x64'
          for f in mysql56-client-5.6.51.pkg mysql56-server-5.6.51.pkg libcrypto_so_111.tgz libssl_so_111.tgz; do
            curl -fL --retry 3 "$base/$f" -o ".mysql56-helpdev/$f"
            sha256sum ".mysql56-helpdev/$f"
          done

      - name: Test on FreeBSD ${{ matrix.freebsd }}
        uses: cross-platform-actions/action@24ef01df165c76df1ed2b9f9e9212e78dc2fc963
        with:
          operating_system: freebsd
          architecture: x86-64
          version: ${{ matrix.freebsd }}
          shell: sh
          run: |
            set -eux
            freebsd-version
            uname -a
            cd "$GITHUB_WORKSPACE/.mysql56-helpdev"
            sudo tar -xzf libcrypto_so_111.tgz -C /
            sudo tar -xzf libssl_so_111.tgz -C /
            sudo env ASSUME_ALWAYS_YES=yes pkg install -y ./mysql56-client-5.6.51.pkg ./mysql56-server-5.6.51.pkg
            pkg info mysql56-client mysql56-server
            mysql --version
            MYSQLD=$(find /usr/local -type f -name mysqld 2>/dev/null | head -n1)
            test -n "$MYSQLD"
            "$MYSQLD" --version
            if ldd "$MYSQLD" | grep -q 'not found'; then ldd "$MYSQLD"; exit 1; fi
            ldd "$MYSQLD"
            echo "MySQL 5.6.51 runtime OK on FreeBSD ${{ matrix.major }}"
